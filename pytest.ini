[pytest]
testpaths = tests
python_files = test_*.py
addopts = --strict-markers -ra

# The suite pins the reference values in CLAUDE.md, api/CLAUDE.md and
# docs/SPECIFICATION.md §9. Run it before every release:
#
#     pip install -r requirements.txt -r requirements-dev.txt
#     pytest
#
# The ΔP, PRV, i18n and architecture tests need no dependencies at all; only the Flow
# Regime tests require requirements.txt (numpy/matplotlib/seaborn).
