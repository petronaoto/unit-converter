<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Day 11 mockup — the letter is the easy part</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html,body{margin:0;padding:0;background:#020617;}
  #shot{box-sizing:border-box;width:1200px;height:675px;position:relative;overflow:hidden;
        background:radial-gradient(1200px 700px at 20% 0%, #0f172a 0%, #020617 70%);
        font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;}
  #arrows{position:absolute;left:0;top:0;width:1200px;height:675px;pointer-events:none;z-index:40;}
  #app{position:absolute;width:1280px;height:1900px;left:-20000px;top:0;border:0;pointer-events:none;}
</style>
</head>
<body>

<!--
  Day 11 — "Required area 5.7047 in². The letter is the easy part."

  Two real cases from the same card, sized minutes apart:
    A  the case the tool ships behind the "Load example" button  -> 0.7144 in2 -> orifice H
    B  the published reference vector (SPECIFICATION.md section 9) -> 5.7047 in2 -> orifice P

  Both "Sizing Results" panels are CLONED from the live Safety card, not redrawn. The point of
  the pairing is what does NOT move between them: C = 346.9764 and the critical pressure ratio
  0.5457 are functions of k alone, so an eight-fold difference in required area leaves both
  untouched. That is asserted, not asserted-by-eyeball - see the data-ready string.

  Serve the repo root over HTTP and open /docs/linkedin/day11-mockup.html, then screenshot
  #shot (1200x675) or call buildStandalone().
-->
<iframe id="app" src="../../index.html?fresh=1"></iframe>

<div id="shot">

  <div class="absolute top-6 left-10 flex items-center gap-3 z-30 whitespace-nowrap">
    <span class="w-2 h-2 rounded-full bg-rose-500 shrink-0"></span>
    <span class="text-slate-400 text-[13px] tracking-wide whitespace-nowrap">O&amp;G Engineering Converter
      <span class="text-slate-600">v3.8.4</span>
      <span class="text-slate-600">·</span> Safety <span class="text-slate-600">▸</span>
      API 520 Part I <span class="text-slate-600">▸</span> §5.6 Gas / Vapor Relief</span>
  </div>

  <!-- ================= case A ================= -->
  <div class="absolute" style="left:28px;top:64px;width:560px;">
    <div class="text-sky-300 text-[11.5px] tracking-[0.13em]">CASE A — THE ↺ LOAD EXAMPLE CASE</div>
    <div class="text-slate-500 text-[11.5px]" style="margin-top:4px;" id="inputs-a">…</div>
    <div id="card-a" style="margin-top:9px;"></div>
  </div>

  <!-- ================= case B ================= -->
  <div class="absolute" style="left:612px;top:64px;width:560px;">
    <div class="text-amber-300 text-[11.5px] tracking-[0.13em]">CASE B — THE PUBLISHED REFERENCE VECTOR</div>
    <div class="text-slate-500 text-[11.5px]" style="margin-top:4px;" id="inputs-b">…</div>
    <div id="card-b" style="margin-top:9px;"></div>
  </div>

  <!-- ================= what does not move ================= -->
  <div class="absolute rounded-lg px-4 py-3" style="left:28px;top:302px;width:1144px;
       border:1px solid rgba(148,163,184,.22);background:rgba(15,23,42,.55);">
    <div class="text-slate-200 text-[13px] font-semibold" style="margin-bottom:7px;" id="invariant-head">…</div>
    <div id="invariant" class="text-slate-400 text-[12.5px] leading-relaxed">…</div>
  </div>

  <!-- ================= why critical ================= -->
  <div class="absolute rounded-lg px-4 py-3" style="left:28px;top:430px;width:1144px;
       border:1px solid rgba(244,63,94,.28);background:rgba(244,63,94,.07);">
    <div id="why" class="text-slate-300 text-[12.5px] leading-relaxed">…</div>
  </div>

  <div class="absolute flex items-baseline justify-between" style="left:52px;right:56px;top:646px;">
    <div class="text-slate-400 text-[15px] font-medium tracking-wide">engineering-converter.com</div>
    <div class="text-slate-600 text-[13px]">free &middot; no sign-up &middot; no tracking &middot; 10 languages</div>
  </div>

  <svg id="arrows" viewBox="0 0 1200 675" width="1200" height="675"></svg>
</div>

<script>
var STYLE_PROPS = ['display','position','top','left','right','bottom','width','height','min-width',
  'max-width','min-height','margin-top','margin-right','margin-bottom','margin-left','padding-top',
  'padding-right','padding-bottom','padding-left','border-top-width','border-right-width',
  'border-bottom-width','border-left-width','border-style','border-top-color','border-right-color',
  'border-bottom-color','border-left-color','border-radius','background-color','background-image',
  'color','font-family','font-size','font-weight','font-style','line-height','letter-spacing',
  'text-transform','text-align','opacity','box-shadow','flex-grow','flex-shrink','flex-basis',
  'flex-direction','align-items','justify-content','gap','overflow','z-index','white-space',
  'vertical-align','appearance','text-decoration','backdrop-filter',
  'grid-template-columns','grid-template-rows','grid-auto-flow','grid-auto-columns',
  'grid-auto-rows','grid-column','grid-row','row-gap','column-gap','align-self','justify-self',
  'transform','transform-origin'];

function freezeStyle(src, dst, win) {
  var cs = win.getComputedStyle(src), css = 'box-sizing:border-box;';
  for (var n = 0; n < STYLE_PROPS.length; n++) {
    var prop = STYLE_PROPS[n], val = cs.getPropertyValue(prop);
    if (!val) { continue; }
    if (prop !== 'display' && (val === 'none' || val === 'normal' || val === 'auto' || val === '0s')) { continue; }
    if (prop === 'display' && (val === 'normal' || val === 'auto')) { continue; }
    if (val === '0px' && !/^border-(top|right|bottom|left)-width$/.test(prop)) { continue; }
    css += prop + ':' + val + ';';
  }
  dst.setAttribute('style', css);
  dst.removeAttribute('class');
}

function cloneResults(doc, win, slotId, width) {
  var node = doc.getElementById('psv-out-area').parentElement.parentElement.parentElement.parentElement;
  var clone = node.cloneNode(true);
  var srcAll = [node].concat([].slice.call(node.querySelectorAll('*')));
  var dstAll = [clone].concat([].slice.call(clone.querySelectorAll('*')));
  for (var m = 0; m < srcAll.length; m++) { freezeStyle(srcAll[m], dstAll[m], win); }
  // A frozen width is a pixel-exact fit measured in the FRAME; the capture browser's metrics
  // differ by a fraction of a pixel and short labels wrapped on Day 7. Let leaf text size itself.
  [].forEach.call(clone.querySelectorAll('*'), function (el) {
    if (el.children.length) { return; }
    el.style.whiteSpace = 'nowrap';
    if (el.style.display === 'inline-block') { el.style.width = 'auto'; }
  });
  // Setting an outer width does NOT reflow a clone whose inner grid columns are already frozen
  // at the app's ~1100 px layout - the third column simply gets clipped. Scale the whole card
  // instead, and give the wrapper the scaled height so nothing below it overlaps.
  var rect = node.getBoundingClientRect();
  var k = width / rect.width;
  clone.style.width = rect.width + 'px';
  clone.style.transformOrigin = '0 0';
  clone.style.transform = 'scale(' + k + ')';
  var slot = document.getElementById(slotId);
  slot.innerHTML = '';
  slot.style.height = Math.ceil(rect.height * k) + 'px';
  slot.style.overflow = 'hidden';
  slot.appendChild(clone);
  return clone;
}

var A = null, B = null;

function buildCard() {
  var fr = document.getElementById('app');
  var doc = fr.contentDocument, win = fr.contentWindow;
  var kill = doc.createElement('style');
  kill.textContent = '*,*::before,*::after{transition:none !important;animation:none !important;}';
  doc.head.appendChild(kill);
  if (typeof win.setLanguage === 'function') { win.setLanguage('en'); }

  setTimeout(function () {
    win.switchTab('safety');
    var sel = doc.getElementById('psv-mode');
    sel.value = 'gas';
    sel.dispatchEvent(new win.Event('change', { bubbles: true }));
    setTimeout(function () {
      win.psvLoadExample();
      setTimeout(function () { win.calcPSV(); waitFor(doc, win, 'A', 0); }, 300);
    }, 250);
  }, 900);
}

function readOut(doc) {
  return {
    area: doc.getElementById('psv-out-area').textContent.trim(),
    unit: doc.getElementById('psv-out-area-unit').textContent.trim(),
    orifice: doc.getElementById('psv-out-orifice').textContent.trim(),
    oarea: doc.getElementById('psv-out-orifice-area').textContent.trim(),
    details: doc.getElementById('psv-out-details').textContent.trim(),
    badge: doc.getElementById('psv-badge').textContent.trim()
  };
}

function waitFor(doc, win, which, tries) {
  var a = doc.getElementById('psv-out-area').textContent.trim();
  var ready = a && a !== '—' && (which === 'A' ? a !== (B && B.area) : a !== (A && A.area));
  if (ready) {
    if (which === 'A') {
      A = readOut(doc);
      A.inputs = 'W 8,000 lb/h · M 19 · k 1.3 · T 560 °R · Z 1.0 · P₁ 179.7 psia · P₂ 0 · K_d 0.975';
      cloneResults(doc, win, 'card-a', 560);
      // now drive case B: the published reference vector
      var set = function (id, v) {
        var e = doc.getElementById(id); e.value = v;
        e.dispatchEvent(new win.Event('input', { bubbles: true }));
        e.dispatchEvent(new win.Event('change', { bubbles: true }));
      };
      set('psv-W', '53500'); set('psv-M', '51'); set('psv-k', '1.3'); set('psv-T', '627');
      set('psv-Z', '1.0'); set('psv-P1', '97.2'); set('psv-P2', '0'); set('psv-Kd', '0.975');
      win.calcPSV();
      setTimeout(function () { waitFor(doc, win, 'B', 0); }, 400);
      return;
    }
    B = readOut(doc);
    B.inputs = 'W 53,500 lb/h · M 51 · k 1.3 · T 627 °R · Z 1.0 · P₁ 97.2 psia · P₂ 0 · K_d 0.975';
    cloneResults(doc, win, 'card-b', 560);
    fillPanels();
    return;
  }
  if (tries > 150) { document.body.setAttribute('data-ready', 'TIMEOUT-' + which); return; }
  setTimeout(function () { waitFor(doc, win, which, tries + 1); }, 100);
}

function pick(details, key) {
  var m = details.match(new RegExp(key.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*=\\s*([0-9.]+)'));
  return m ? m[1] : null;
}

function fillPanels() {
  document.getElementById('inputs-a').textContent = A.inputs;
  document.getElementById('inputs-b').textContent = B.inputs;

  var cA = pick(A.details, 'C'), cB = pick(B.details, 'C');
  var rA = pick(A.details, 'Pcf/P1'), rB = pick(B.details, 'Pcf/P1');
  var pA = pick(A.details, 'Pcf'), pB = pick(B.details, 'Pcf');
  var sameC = cA === cB, sameR = rA === rB, diffP = pA !== pB;

  document.getElementById('invariant-head').innerHTML =
    'The required area differs by a factor of ' + (parseFloat(B.area) / parseFloat(A.area)).toFixed(1)
    + '. Two of the three intermediates do not move at all.';

  document.getElementById('invariant').innerHTML =
    '<b style="color:#6ee7b7;">C = ' + cA + '</b> in both, and <b style="color:#6ee7b7;">'
    + 'P<sub>cf</sub>/P₁ = ' + rA + '</b> in both — because each is a function of <b>k = 1.3 alone</b>: '
    + 'C = 520·√( k·(2/(k+1))^((k+1)/(k−1)) ) and the critical ratio is (2/(k+1))^(k/(k−1)). '
    + 'What does move is <b style="color:#fcd34d;">P<sub>cf</sub></b>: ' + pA + ' psia against ' + pB
    + ' psia — because that one is a ratio <i>of P₁</i>, and P₁ is the only pressure that changed.';

  document.getElementById('why').innerHTML =
    '<b style="color:#fda4af;">And the branch is critical because P₂ sits below P<sub>cf</sub>, not because the tool defaults there.</b> '
    + 'Both cases relieve to P₂ = 0 psig, far under ' + pA + ' and ' + pB + ' psia respectively, so the flow chokes and the '
    + 'back-pressure drops out of the equation entirely. Raise P₂ past P<sub>cf</sub> and the same card switches to the '
    + 'subcritical form — which is the five seconds of a review where the letter stops mattering and the assumption starts.';

  document.getElementById('arrows').innerHTML = '';

  document.body.setAttribute('data-ready', [
    'A_area=' + A.area + A.unit, 'A_orifice=' + A.orifice + '/' + A.oarea,
    'B_area=' + B.area + B.unit, 'B_orifice=' + B.orifice + '/' + B.oarea,
    'C_same=' + sameC + '(' + cA + ')',
    'ratio_same=' + sameR + '(' + rA + ')',
    'Pcf_differs=' + diffP + '(' + pA + ' vs ' + pB + ')',
    'A_badge=' + A.badge, 'B_badge=' + B.badge
  ].join('|'));
}

function buildStandalone() {
  var shot = document.getElementById('shot');
  var clone = shot.cloneNode(true);
  var srcAll = [shot].concat([].slice.call(shot.querySelectorAll('*')));
  var dstAll = [clone].concat([].slice.call(clone.querySelectorAll('*')));
  for (var i = 0; i < srcAll.length; i++) {
    var s = srcAll[i], d = dstAll[i];
    if (s.closest('svg') && s.tagName.toLowerCase() !== 'svg') { continue; }
    if (d.getAttribute('style') && !d.getAttribute('class')) { continue; }
    freezeStyle(s, d, window);
  }
  var html = '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n'
    + '<title>Day 11 — the letter is the easy part</title>\n'
    + '<style>html,body{margin:0;padding:0;background:#020617;}</style>\n</head>\n<body>\n'
    + clone.outerHTML + '\n</body>\n</html>\n';
  return fetch('/__save?to=docs/linkedin/day11-standalone.html',
               { method: 'POST', body: html }).then(function (r) { return r.text(); });
}

document.getElementById('app').addEventListener('load', function () { setTimeout(buildCard, 400); });
</script>
</body>
</html>
