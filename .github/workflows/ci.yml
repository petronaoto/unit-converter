name: Reference-value regression

# Runs the checklist in docs/DEVELOPMENT_PLAN.md §7.2 ("Reference-value regression —
# mandatory before any release") automatically, so a broken reference vector is caught on
# the PR rather than after it has deployed to production.
#
# Merging to `main` triggers a Vercel deployment, so this workflow deliberately runs on
# pull_request as well as push — the PR run is the one that matters.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The endpoints that are required to stay standard-library-only are tested with NO pip
  # install at all. That is not just a speed optimisation: if someone ever adds a
  # third-party import to dp_calculator.py or psv_calculator.py, this job fails to import
  # it, which is exactly the architectural rule in api/CLAUDE.md being enforced.
  stdlib-only:
    name: ΔP · PRV · i18n · architecture (no dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # matches the Vercel Python runtime

      - name: Install pytest only
        run: pip install -r requirements-dev.txt

      # Runs EVERYTHING except the one file that needs numpy/matplotlib, rather than an
      # explicit allowlist. The allowlist this replaced silently orphaned two whole test
      # files (test_js_constants.py, test_share_state.py — 45 tests, including every guard
      # on the share-link import sanitizer) because they were added in later PRs and nobody
      # remembered to extend the list. tests/test_architecture.py now also asserts that
      # every test file is reachable from this workflow.
      - name: Run the dependency-free suite
        run: pytest -v --ignore=tests/test_flowregime.py

  # flowregime.py is the one endpoint permitted dependencies, so its tests get the
  # production requirements.txt installed. compute() is a pure function — no PNG is
  # rendered here — but the module imports matplotlib/numpy/seaborn at module scope.
  flow-regime:
    name: Flow Regime (numpy · matplotlib · seaborn)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install production and dev dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the Flow Regime suite
        env:
          MPLBACKEND: Agg
        run: pytest -v tests/test_flowregime.py
